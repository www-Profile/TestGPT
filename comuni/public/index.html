<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3fb">
  <title>Comuni — мессенджер</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="Comuni, общий чат"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>Comuni<span class="brand-dot">.</span></a>
      <div class="rooms-heading"><h2>Комнаты</h2><button id="create" class="square" type="button" aria-label="Создать комнату" title="Создать комнату">+</button></div>
      <nav aria-label="Комнаты" id="rooms"></nav>
      <button class="profile" id="profile" type="button"><span id="initial" class="profile-initial">Г</span><span><strong id="display-name">Гость</strong><small>Мой профиль</small></span><span class="profile-edit" aria-hidden="true">↗</span></button>
    </aside>
    <main class="chat">
      <header class="chat-header">
        <button class="square menu" id="menu" type="button" aria-label="Показать комнаты" aria-expanded="false" aria-controls="sidebar">☰</button>
        <span class="room-symbol" aria-hidden="true">#</span>
        <div class="chat-title"><h1 id="room-name">Общий чат</h1><p id="connection" role="status">Подключаемся…</p></div>
        <button class="invite" id="invite" type="button" disabled>Пригласить <span aria-hidden="true">↗</span></button>
      </header>
      <div class="conversation" id="conversation" tabindex="0" aria-label="История сообщений">
        <section class="welcome" id="welcome" hidden>
          <div class="welcome-icon" aria-hidden="true"><span></span><span></span><span></span></div>
          <h2>Здесь начинается разговор</h2>
          <p>Напиши первое сообщение или пригласи друга по ссылке.</p>
        </section>
        <ol class="messages" id="messages" aria-label="Сообщения" aria-live="polite"></ol>
      </div>
      <div class="composer">
        <p id="notice" role="status"></p>
        <form id="compose"><label class="sr-only" for="message">Сообщение</label><textarea id="message" rows="1" maxlength="2000" placeholder="Написать сообщение…" required disabled></textarea><button class="send" type="submit" disabled aria-label="Отправить сообщение" title="Отправить сообщение">↑</button></form>
        <p class="hint">Enter — отправить · Shift + Enter — новая строка</p>
      </div>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <h2 id="editor-title"></h2>
      <label id="edit-label" for="edit-value"></label>
      <input id="edit-value" required autofocus>
      <p id="edit-error" role="status"></p>
      <div class="dialog-actions"><button id="cancel" class="invite" type="button">Отмена</button><button class="action" id="save" type="submit">Сохранить</button></div>
    </form>
  </dialog>
  <dialog id="invite-dialog" aria-labelledby="invite-title">
    <form method="dialog">
      <h2 id="invite-title">Ссылка на комнату</h2>
      <p>Открой доступ к комнате, отправив эту ссылку собеседнику.</p>
      <input id="invite-url" aria-label="Ссылка на комнату" readonly>
      <p id="copy-status" role="status"></p>
      <div class="dialog-actions"><button class="invite">Закрыть</button><button class="action" type="button" id="copy">Скопировать</button></div>
    </form>
  </dialog>
</body>
</html>
